name: Build Windows App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://rayahoosh.ct.ws
  APP_NAME: Rayahoosh

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare icon (any name, any format -> proper 256px .ico)
        run: |
          mkdir -p tools
          cat > tools/package.json <<'EOF'
          { "name": "tools", "private": true }
          EOF
          cat > tools/prep-icon.js <<'EOF'
          const fs = require('fs');
          const sharp = require('sharp');
          const pngToIco = require('png-to-ico');

          const files = fs.readdirSync('.').filter(f => fs.statSync(f).isFile());
          const pick = re => files.filter(f => re.test(f)).sort();

          // Priority: icon*.png/jpg/webp -> any png/jpg/webp -> any .ico
          const img =
            pick(/^icon.*\.(png|jpe?g|webp)$/i)[0] ||
            pick(/\.(png|jpe?g|webp)$/i)[0];
          const ico = pick(/\.ico$/i)[0];

          (async () => {
            if (img) {
              console.log('Using image:', img);
              const sizes = [256, 128, 64, 48, 32, 16];
              const bufs = [];
              for (const s of sizes) {
                bufs.push(
                  await sharp(img)
                    .resize(s, s, { fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 } })
                    .png()
                    .toBuffer()
                );
              }
              fs.writeFileSync('app-icon.ico', await pngToIco(bufs));
            } else if (ico) {
              console.log('Using ico as-is:', ico);
              fs.copyFileSync(ico, 'app-icon.ico');
            } else {
              console.error('::error::No icon found in repo root. Upload a PNG/JPG/ICO file (any name, ideally 256x256+) next to the .github folder.');
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, 'ICON=app-icon.ico\n');
          })();
          EOF
          (cd tools && npm install sharp@0.33 png-to-ico@2.1.8)
          node tools/prep-icon.js
          rm -rf tools

      - name: Generate main.js
        run: |
          cat > main.js <<'EOF'
          const { app, BrowserWindow, session, desktopCapturer, dialog, Menu } = require('electron');
          const path = require('path');

          const SITE_URL = '__SITE_URL__';
          const ICON_FILE = '__ICON__';

          if (!app.requestSingleInstanceLock()) {
            app.quit();
          }

          let win;

          function createWindow() {
            win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              title: '__APP_NAME__',
              icon: path.join(__dirname, ICON_FILE),
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true,
                backgroundThrottling: false
              }
            });

            Menu.setApplicationMenu(null);

            // Chrome-like User-Agent (some free hosts block Electron)
            const ua = win.webContents.getUserAgent()
              .replace(/\sElectron\/[\d.]+/, '')
              .replace(/\s[\w-]+\/[\d.]+\sChrome/, ' Chrome');
            win.webContents.setUserAgent(ua);

            win.loadURL(SITE_URL);
            win.webContents.setWindowOpenHandler(() => ({ action: 'allow' }));
            win.on('closed', () => { win = null; });
          }

          app.whenReady().then(() => {
            const ses = session.defaultSession;

            // Grant every permission (mic, camera, geolocation, notifications, clipboard, ...)
            ses.setPermissionRequestHandler((_wc, _permission, callback) => callback(true));
            ses.setPermissionCheckHandler(() => true);
            ses.setDevicePermissionHandler(() => true);

            // Screen share
            ses.setDisplayMediaRequestHandler(async (_request, callback) => {
              try {
                const sources = await desktopCapturer.getSources({
                  types: ['screen', 'window'],
                  thumbnailSize: { width: 0, height: 0 }
                });
                if (!sources.length) return callback({});

                let chosen = sources[0];
                if (sources.length > 1) {
                  const { response } = await dialog.showMessageBox(win, {
                    type: 'question',
                    title: 'اشتراک صفحه',
                    message: 'کدام صفحه یا پنجره را به اشتراک بگذارم؟',
                    buttons: sources.map(s => s.name).concat('لغو'),
                    cancelId: sources.length,
                    noLink: true
                  });
                  if (response === sources.length) return callback({});
                  chosen = sources[response];
                }
                callback({ video: chosen, audio: 'loopback' });
              } catch (e) {
                callback({});
              }
            });

            createWindow();
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on('second-instance', () => {
            if (win) {
              if (win.isMinimized()) win.restore();
              win.focus();
            }
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF
          sed -i "s|__SITE_URL__|$SITE_URL|g; s|__ICON__|$ICON|g; s|__APP_NAME__|$APP_NAME|g" main.js

      - name: Generate package.json
        run: |
          cat > gen-package.js <<'EOF'
          const fs = require('fs');
          const icon = process.env.ICON;
          const name = process.env.APP_NAME;
          const pkg = {
            name: name.toLowerCase(),
            version: '1.0.0',
            description: name + ' Desktop App',
            author: 'Arshiya',
            main: 'main.js',
            devDependencies: {
              electron: '^33.2.0',
              'electron-builder': '^25.1.8'
            },
            build: {
              appId: 'com.' + name.toLowerCase() + '.app',
              productName: name,
              directories: { output: 'dist' },
              files: ['main.js', icon, 'package.json'],
              win: {
                target: [{ target: 'nsis', arch: ['x64'] }],
                icon: icon,
                artifactName: name + '-Setup-${version}.${ext}'
              },
              nsis: {
                oneClick: false,
                allowToChangeInstallationDirectory: true,
                perMachine: false,
                createDesktopShortcut: true,
                createStartMenuShortcut: true,
                shortcutName: name
              }
            }
          };
          // NSIS installer/uninstaller icons must be .ico
          if (icon.endsWith('.ico')) {
            pkg.build.nsis.installerIcon = icon;
            pkg.build.nsis.uninstallerIcon = icon;
            pkg.build.nsis.installerHeaderIcon = icon;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          EOF
          node gen-package.js
          rm gen-package.js
          cat package.json

      - name: Install dependencies
        run: npm install

      - name: Build EXE (NSIS Setup)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup-EXE
          path: dist/*.exe

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
